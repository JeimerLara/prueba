<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Reloj</title>
</head>
<body>
    <div class="container">
        <div>
            <h1>Reloj</h1>
            <p id="reloj">00:00:00</p>
        </div>
        <h1>Cuenta regresiva</h1>
        <div class="countdown">
            <div>
                <h2>Meses</h2>
                <p id="meses">00</p>
            </div>
            <div>
                <h2>Días</h2>
                <p id="dias">00</p>
            </div>
            <div>
                <h2>Horas</h2>
                <p id="horas">00</p>
            </div>
            <div>
                <h2>Minutos</h2>
                <p id="minutos">00</p>
            </div>
            <div>
                <h2>Segundos</h2>
                <p id="segundos">00</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
